<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Food Review</title>
</head>

<body>
  <header>
    <h1 id="title">Food Review</h1>
    <p id="description">Thank you for testing our food. If you have time, we would like to know what parts we can
      improve.</p>
    <header />

    <main>
      <form id="survey-form">
        <fieldset>
          <legend>Personal information</legend>
          <label id="name-label" for="name">Name</label>
          <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          required>

          <label id="email-label" for="email">Email</label>
          <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required>

          <label id="number-label" for="number">Age (optional)</label>
          <input
          type="number"
          id="number"
          name="age"
          placeholder="Age"
          min="2"
          max="100">
        </fieldset>

        <label>What could we improve on?</label>
        <select id="dropdown">
        <option>Food Quality</option>
        <option>Service</option>
        <option>Interior</option>
        <option>Our personal</option>
        </select>

        <p>Would you recommend our restaurant to other people?</p>

        <label>
        <input type="radio" name="recommend" value="yes">
        Yes
        </label>

        <label>
        <input type="radio" name="recommend" value="no">
        No
        </label>

        <p>What did you like?</p>

        <label>
        <input type="checkbox" value="food">
        Food
        </label>

        <label>
        <input type="checkbox" value="service">
        Service
        </label>

        <label>
        <input type="checkbox" value="interior">
        Interior
        </label>

        <label for="comments">Additional comments</label>

        <textarea
        id="comments"
        name="comments"
        placeholder="Write your comments here">
        </textarea>

        <button id="submit" type="submit">
        Submit
        </button>
        
      </form>
    </main>
      
</body>

</html>
