<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link href="styles.css" rel="stylesheet" />
</head>

<body>
    <div class="blog-post-card">
        <img class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="a person typing on a laptop">

        <div class="post-content">
            <h2 class="post-title">Learn more about me</h2>
            <p class="post-excerpt">A graduate student that are looking for his first job...</p>
            <a class="read-more">Read More</a>
        </div>
    </div>
</body>

</html>
