<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
     <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>My To-Do List</h1>

    <ul class="todo-list">
        
        <li>
            <input type="checkbox" id="store-link">
            <label for="store-link">Explore gaming keyboards</label>
            <ul class="sub-item">
                <li>
                    <a href="https://www.w3schools.com/tags/tag_a.asp" class="sub-item-link" 
                    target="_blank">
                    Example
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="request-access">
            <label for="request-access"> Finish the report</label>
            <ul class="sub-item">
                <li>
                    <a href="https://www.w3schools.com/tags/tag_a.asp" class="sub-item-link" target="_blank">
                    Example
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="view-receipts">
            <label for="view-receipts">View Phone's Warranty</label>
            <ul class="sub-item">
                <li>
                    <a href="https://www.w3schools.com/tags/tag_a.asp" class="sub-item-link" target="_blank">
                    Example
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="view-model-number">
            <label for="view-model-number">Check Processor Specs</label>
            <ul class="sub-item">
                <li>
                    <a href="https://www.w3schools.com/tags/tag_a.asp" class="sub-item-link" target="_blank">
                    Example
                    </a>
                </li>
            </ul>
        </li>

    </ul>
</body>

</html>
